name: Matching Tests

on:
  push:
    paths:
      - "src/spotify.py"
      - "src/__init__.py"
      - "src/matcher_policy.py"
      - "src/retrieval_policy.py"
      - "src/artist_bound_rank_fallback.py"
      - "src/retrieval_benchmark.py"
      - "src/production_retrieval_benchmark.py"
      - "src/retrieval_spotcheck.py"
      - "src/tunemymusic_failure_diagnostic.py"
      - "tests/test_spotify_matching.py"
      - "tests/test_matcher_policy.py"
      - "tests/test_retrieval_policy.py"
      - "tests/test_retrieval_policy_hardening.py"
      - "tests/test_retrieval_benchmark.py"
      - "tests/test_production_retrieval_benchmark.py"
      - "tests/test_retrieval_spotcheck.py"
      - "data/retrieval_spotcheck_5.txt"
      - "data/retrieval_title_alias_spotcheck_5.json"
      - "data/tunemymusic_retrieval_failures_37.txt"
      - "data/tunemymusic_saved_candidate_failures_6.txt"
      - "data/tunemymusic_baseline_97_of_140.json"
      - "requirements.txt"
      - ".github/workflows/matching-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run matching tests
        env:
          PYTHONPATH: .
        run: python -m pytest
