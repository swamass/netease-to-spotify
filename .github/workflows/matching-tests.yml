name: Matching Tests

on:
  push:
    paths:
      - "src/spotify.py"
      - "tests/test_spotify_matching.py"
      - "requirements.txt"
      - ".github/workflows/matching-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run matching tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_spotify_matching.py
