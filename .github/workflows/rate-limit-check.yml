name: Spotify Rate Limit Check

on:
  push:
    branches:
      - diagnostic/rate-limit-check-20260916
    paths:
      - .github/workflows/rate-limit-check.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Send one read-only Spotify Search
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from src import spotify

          token = spotify.get_access_token(
              os.environ['SPOTIFY_CLIENT_ID'],
              os.environ['SPOTIFY_CLIENT_SECRET'],
              os.environ['SPOTIFY_REFRESH_TOKEN'],
          )
          try:
              response = spotify._spotify_get(
                  f"{spotify.SPOTIFY_API_URL}/search",
                  token,
                  {"q": 'track:"Dress Down" artist:"Kaoru Akimoto"', "type": "track", "limit": 1},
              )
              items = [] if response is None else response.json().get('tracks', {}).get('items', [])
              print(f"RATE_LIMIT_CHECK=OK candidates={len(items)}")
          except spotify.SpotifyRateLimitError as exc:
              print(f"RATE_LIMIT_CHECK=LIMITED retry_after={getattr(exc, 'retry_after_seconds', None)}")
              raise
          PY
