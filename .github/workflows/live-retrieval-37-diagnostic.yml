name: Live Retrieval 37 Diagnostic

on:
  push:
    branches:
      - diagnostic/live-retrieval-37
    paths:
      - src/live_retrieval_37_diagnostic.py
      - .github/workflows/live-retrieval-37-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download saved benchmark artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prior-retrieval prior-replay
          gh run download 34570058054 \
            --repo "${{ github.repository }}" \
            --name spotify-retrieval-benchmark \
            --dir prior-retrieval
          gh run download 34753411423 \
            --repo "${{ github.repository }}" \
            --name matcher-replay \
            --dir prior-replay
          test -f prior-retrieval/retrieval_benchmark.json
          test -f prior-replay/matcher_replay.json

      - name: Run live retrieval diagnostic
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: >-
          python -m src.live_retrieval_37_diagnostic
          prior-retrieval/retrieval_benchmark.json
          prior-replay/matcher_replay.json
          data/tunemymusic_missing_7.txt
          --json live_retrieval_37_diagnostic.json
          --delay 0.8

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-retrieval-37-diagnostic
          path: live_retrieval_37_diagnostic.json
          if-no-files-found: error
