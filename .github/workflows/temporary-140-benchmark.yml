name: Temporary 140-Track Retrieval Benchmark

on:
  workflow_dispatch:

concurrency:
  group: spotify-api-shared
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Obtain Spotify access token
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from src.spotify import get_access_token

          token = get_access_token(
              os.environ["SPOTIFY_CLIENT_ID"],
              os.environ["SPOTIFY_CLIENT_SECRET"],
              os.environ["SPOTIFY_REFRESH_TOKEN"],
          )
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"SPOTIFY_ACCESS_TOKEN={token}\n")
          PY

      - name: Run temporary 140-track read-only benchmark
        env:
          SPOTIFY_ACCESS_TOKEN: ${{ env.SPOTIFY_ACCESS_TOKEN }}
        run: >-
          python -m src.production_retrieval_benchmark
          data/tunemymusic_japanese_147.txt
          --missing-reference data/tunemymusic_missing_7.txt
          --baseline-accepted 97
          --access-token "$SPOTIFY_ACCESS_TOKEN"
          --delay-seconds 1.0
          --json production_retrieval_benchmark_140.json

      - name: Upload 140-track benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temporary-140-retrieval-benchmark
          path: production_retrieval_benchmark_140.json
          if-no-files-found: error
