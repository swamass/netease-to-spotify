name: Spotify Retrieval Benchmark

on:
  workflow_dispatch:

concurrency:
  group: spotify-api-shared
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Obtain Spotify access token
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from src.spotify import get_access_token

          token = get_access_token(
              os.environ["SPOTIFY_CLIENT_ID"],
              os.environ["SPOTIFY_CLIENT_SECRET"],
              os.environ["SPOTIFY_REFRESH_TOKEN"],
          )
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"SPOTIFY_ACCESS_TOKEN={token}\n")
          PY

      - name: Run low-traffic title-alias retrieval spot check
        env:
          SPOTIFY_ACCESS_TOKEN: ${{ env.SPOTIFY_ACCESS_TOKEN }}
        run: >-
          python -m src.retrieval_spotcheck
          data/retrieval_spotcheck_5.txt
          --allowed-failures data/tunemymusic_retrieval_failures_37.txt
          --baseline-metadata data/tunemymusic_baseline_97_of_140.json
          --title-aliases data/retrieval_title_alias_spotcheck_5.json
          --access-token "$SPOTIFY_ACCESS_TOKEN"
          --max-search-requests 10
          --delay-seconds 1.0
          --json retrieval_spotcheck.json

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotify-retrieval-benchmark
          path: retrieval_spotcheck.json
          if-no-files-found: error
