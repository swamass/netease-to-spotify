name: Compare Spotify Matching Versions

on:
  push:
    branches:
      - fix/daily-recommendations-matching-20261016
    paths:
      - ".github/workflows/compare-matching-versions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spotify-api-shared
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the fix branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compare old and new matching on the same 32 recommendations
        env:
          PYTHONPATH: .
          NETEASE_COOKIE: ${{ secrets.NETEASE_COOKIE }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: |
          git fetch origin main:refs/remotes/origin/main --depth=1
          git worktree add --detach /tmp/old-version refs/remotes/origin/main

          python - <<'PY'
          import contextlib
          import io
          import json
          import os
          import subprocess
          import sys
          import time

          from src.netease import get_daily_recommendations
          from src.spotify import get_access_token

          cookie = os.environ.get("NETEASE_COOKIE", "").strip()
          if not cookie:
              raise SystemExit("NETEASE_COOKIE secret is missing.")

          songs = get_daily_recommendations(cookie, verbose=False)
          if len(songs) != 32:
              raise SystemExit(
                  f"Expected 32 recommendations for a fair A/B test; got {len(songs)}."
              )

          input_path = "/tmp/netease-daily-input.json"
          with open(input_path, "w", encoding="utf-8") as file:
              json.dump(songs, file, ensure_ascii=False, indent=2)

          token = get_access_token(
              os.environ["SPOTIFY_CLIENT_ID"],
              os.environ["SPOTIFY_CLIENT_SECRET"],
              os.environ["SPOTIFY_REFRESH_TOKEN"],
          )

          worker = r"""
          import contextlib
          import io
          import json
          import os
          import time

          from src.spotify import search_track

          with open(os.environ["MATCH_INPUT_PATH"], encoding="utf-8") as file:
              songs = json.load(file)

          results = []
          for index, song in enumerate(songs, start=1):
              captured = io.StringIO()
              with contextlib.redirect_stdout(captured):
                  track_id = search_track(
                      os.environ["SPOTIFY_ACCESS_TOKEN"],
                      song.get("name", ""),
                      song.get("artists") or [],
                      song.get("album") or "",
                      duration_ms=song.get("duration_ms"),
                  )

              lines = captured.getvalue().splitlines()
              candidate = next(
                  (
                      line[len("Matched candidate: "):].split("; Match reason:")[0]
                      for line in reversed(lines)
                      if line.startswith("Matched candidate: ")
                  ),
                  None,
              )
              results.append({
                  "index": index,
                  "name": song.get("name", ""),
                  "artists": song.get("artists") or [],
                  "album": song.get("album") or "",
                  "matched": bool(track_id),
                  "spotify_track_id": track_id,
                  "candidate": candidate,
              })
              time.sleep(0.2)

          print(json.dumps(results, ensure_ascii=False))
          """

          def run_version(label, repo_path):
              env = os.environ.copy()
              env["PYTHONPATH"] = repo_path
              env["MATCH_INPUT_PATH"] = input_path
              env["SPOTIFY_ACCESS_TOKEN"] = token
              completed = subprocess.run(
                  [sys.executable, "-c", worker],
                  cwd=repo_path,
                  env=env,
                  capture_output=True,
                  text=True,
                  timeout=1200,
              )
              if completed.returncode != 0:
                  print(f"{label} matching run failed.")
                  print(completed.stdout[-3000:])
                  print(completed.stderr[-5000:], file=sys.stderr)
                  raise SystemExit(completed.returncode)
              try:
                  return json.loads(completed.stdout)
              except json.JSONDecodeError as error:
                  print(f"{label} returned invalid comparison output.")
                  print(completed.stdout[-3000:])
                  print(completed.stderr[-3000:], file=sys.stderr)
                  raise SystemExit(1) from error

          print("Running OLD matcher from main against the fixed 32-song snapshot...")
          old_results = run_version("OLD", "/tmp/old-version")
          print("Running NEW matcher from this fix branch against the same snapshot...")
          new_results = run_version("NEW", os.environ["GITHUB_WORKSPACE"])

          def summary(results):
              matched_rows = sum(bool(row["spotify_track_id"]) for row in results)
              unique_ids = {
                  row["spotify_track_id"]
                  for row in results
                  if row["spotify_track_id"]
              }
              return {
                  "matched_song_rows": matched_rows,
                  "unique_playlist_tracks": len(unique_ids),
                  "unmatched_song_rows": len(results) - matched_rows,
              }

          old_summary = summary(old_results)
          new_summary = summary(new_results)
          old_by_index = {row["index"]: row for row in old_results}
          new_by_index = {row["index"]: row for row in new_results}

          new_only = []
          old_only = []
          candidate_changed = []
          for index in sorted(old_by_index):
              old = old_by_index[index]
              new = new_by_index[index]
              if old["spotify_track_id"] and not new["spotify_track_id"]:
                  old_only.append({
                      "name": old["name"],
                      "artists": old["artists"],
                      "old_candidate": old["candidate"],
                  })
              elif new["spotify_track_id"] and not old["spotify_track_id"]:
                  new_only.append({
                      "name": new["name"],
                      "artists": new["artists"],
                      "new_candidate": new["candidate"],
                  })
              elif (
                  old["spotify_track_id"]
                  and new["spotify_track_id"]
                  and old["spotify_track_id"] != new["spotify_track_id"]
              ):
                  candidate_changed.append({
                      "name": new["name"],
                      "artists": new["artists"],
                      "old_candidate": old["candidate"],
                      "new_candidate": new["candidate"],
                      "old_track_id": old["spotify_track_id"],
                      "new_track_id": new["spotify_track_id"],
                  })

          report = {
              "source": "one live NetEase snapshot, fetched once and shared by both matchers",
              "total_recommendations": len(songs),
              "old_main": old_summary,
              "new_fix_branch": new_summary,
              "delta_matched_song_rows": (
                  new_summary["matched_song_rows"] - old_summary["matched_song_rows"]
              ),
              "delta_unique_playlist_tracks": (
                  new_summary["unique_playlist_tracks"] - old_summary["unique_playlist_tracks"]
              ),
              "new_only_matches": new_only,
              "old_only_matches": old_only,
              "different_candidates_for_matched_songs": candidate_changed,
              "old_results": old_results,
              "new_results": new_results,
              "playlist_writes": "NOT PERFORMED",
          }
          with open("matching-ab-report.json", "w", encoding="utf-8") as file:
              json.dump(report, file, ensure_ascii=False, indent=2)

          print("\n===== A/B MATCHING SUMMARY =====")
          print(json.dumps({
              "recommendations": len(songs),
              "old_main": old_summary,
              "new_fix_branch": new_summary,
              "delta_matched_song_rows": report["delta_matched_song_rows"],
              "delta_unique_playlist_tracks": report["delta_unique_playlist_tracks"],
              "new_only_matches": len(new_only),
              "old_only_matches": len(old_only),
              "different_candidates_for_matched_songs": len(candidate_changed),
              "playlist_writes": "NOT PERFORMED",
          }, ensure_ascii=False, indent=2))

          for heading, rows, candidate_key in (
              ("NEW-ONLY MATCHES", new_only, "new_candidate"),
              ("OLD-ONLY MATCHES", old_only, "old_candidate"),
          ):
              print(f"\n{heading}:")
              for row in rows:
                  print(
                      f"- {row['name']} - {', '.join(row['artists'])} "
                      f"=> {row.get(candidate_key) or 'no candidate details'}"
                  )

          if candidate_changed:
              print("\nMATCHED TRACKS WITH A DIFFERENT SPOTIFY CANDIDATE:")
              for row in candidate_changed:
                  print(
                      f"- {row['name']} - {', '.join(row['artists'])}\n"
                      f"  OLD: {row['old_candidate']}\n"
                      f"  NEW: {row['new_candidate']}"
                  )

          summary_path = os.environ["GITHUB_STEP_SUMMARY"]
          with open(summary_path, "a", encoding="utf-8") as file:
              file.write("## Spotify matcher A/B comparison\n\n")
              file.write("| Metric | Old main | New fix branch | Difference |\n")
              file.write("|---|---:|---:|---:|\n")
              file.write(
                  f"| Matched recommendation rows | {old_summary['matched_song_rows']} "
                  f"| {new_summary['matched_song_rows']} "
                  f"| {report['delta_matched_song_rows']:+d} |\n"
              )
              file.write(
                  f"| Unique playlist tracks | {old_summary['unique_playlist_tracks']} "
                  f"| {new_summary['unique_playlist_tracks']} "
                  f"| {report['delta_unique_playlist_tracks']:+d} |\n"
              )
              file.write(f"| Same input recommendations | 32 | 32 | 0 |\n")
              file.write(f"| Playlist writes | None | None | None |\n\n")
              file.write(
                  f"- New-only matches: {len(new_only)}\n"
                  f"- Old-only matches: {len(old_only)}\n"
                  f"- Different candidates on songs matched by both: {len(candidate_changed)}\n"
              )
          PY

      - name: Upload detailed comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotify-matching-ab-report
          path: matching-ab-report.json
          if-no-files-found: ignore
