name: Music Identity Experiment

on:
  workflow_dispatch:

jobs:
  identity-experiment:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run read-only identity experiment
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: python -m src.spotify_isrc_experiment | tee identity-experiment.log

      - name: Upload identity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: identity-experiment-report
          path: |
            identity-experiment.log
            identity-experiment-report.json
          if-no-files-found: ignore
